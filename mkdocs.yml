site_name: CCH Research Notes
site_description: Compound Cascading Hazards — copula-based hydrologic risk, SPH, and AI flood prediction
site_author: Ashutosh

site_url: https://Cloakmancer.github.io/CCH_Research/
repo_url: https://github.com/Cloakmancer/CCH_Research
repo_name: CCH_Research
edit_uri: ""

# docs/ is GENERATED by tools/sync_docs.py from "Claude outputs/".
# Never edit files in docs/ directly — they get overwritten on every build.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Revision:
      - Copula · SPH · LSTM: revision-copula-sph-lstm.md
  - Reference:
      - Knowledge Base: knowledge-base.md
      - Literature Reading Guide: literature-guide.md
  - Project:
      - Research Context: research-context.md
      - Research Log: research-log.md
  - Interactive:
      - Overview: interactive.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # Note: GitHub and MkDocs generate different heading slugs for headings
  # containing em dashes. Rather than change the slug function here (which would
  # break links that work on github.com), tools/sync_docs.py rewrites in-page
  # anchor links to the MkDocs form when it copies the files. See rewrite_anchors().
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

plugins:
  - search
